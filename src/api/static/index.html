<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Answering Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120D0A;         /* the library around the book */
    --leather: #2B1A12;
    --parchment: #EAD9B5;
    --parchment-deep: #D9C193;
    --ink: #2A1C12;
    --ink-soft: #5B4532;
    --wax: #7A1F2B;           /* seals, ribbons, focus */
    --gold: #D7A54A;          /* candlelight, gilt edges */
    --fell: "IM Fell English", "EB Garamond", Georgia, serif;
    --fell-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
    --garamond: "EB Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0; min-height: 100vh; color: var(--parchment);
    font: 18px/1.6 var(--garamond);
    background:
      radial-gradient(ellipse 55% 38% at 50% 0%, rgba(215,165,74,.22), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(122,31,43,.18), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
      var(--night);
    overflow-x: hidden;
  }

  /* drifting motes of dust in the candlelight */
  .motes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .motes i {
    position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold); opacity: 0; filter: blur(.4px);
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: .55; }
    85%  { opacity: .35; }
    100% { transform: translate(40px, -105vh); opacity: 0; }
  }

  main { position: relative; max-width: 820px; margin: 0 auto; padding: 64px 22px 96px; }

  /* ---------- the book's title page ---------- */
  header { text-align: center; margin-bottom: 40px; }
  .candle {
    width: 14px; height: 30px; margin: 0 auto 18px; position: relative;
  }
  .candle::before {               /* flame */
    content: ""; position: absolute; left: 1px; top: 0; width: 12px; height: 20px;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 70%, #FFF3C4 0 25%, var(--gold) 55%, rgba(215,165,74,0) 72%);
    box-shadow: 0 0 28px 10px rgba(215,165,74,.35);
    animation: flicker 2.6s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes flicker {
    0%,100% { transform: scale(1) rotate(-1deg); }
    30% { transform: scale(1.06, .95) rotate(2deg); }
    60% { transform: scale(.96, 1.04) rotate(-2deg); }
  }
  h1 {
    font: 400 clamp(2.6rem, 7vw, 4.4rem)/1 var(--fell);
    margin: 0; letter-spacing: .01em; color: var(--parchment);
    text-shadow: 0 0 24px rgba(215,165,74,.25);
  }
  .rule {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 18px auto 14px; color: var(--gold); max-width: 420px;
  }
  .rule::before, .rule::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .lede {
    font: italic 400 1.1rem/1.55 var(--fell); color: rgba(234,217,181,.75);
    max-width: 34em; margin: 0 auto;
  }

  /* ---------- the writing desk (question) ---------- */
  .desk {
    background:
      linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 30%),
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.25), transparent 60%),
      var(--parchment);
    color: var(--ink); border-radius: 6px; padding: 10px 10px 10px 22px;
    display: flex; gap: 10px; align-items: center;
    box-shadow: 0 0 0 1px rgba(215,165,74,.5), 0 0 0 7px var(--leather),
                0 0 0 8px rgba(215,165,74,.35), 0 30px 60px -20px rgba(0,0,0,.8);
  }
  .desk:focus-within { box-shadow: 0 0 0 2px var(--gold), 0 0 0 7px var(--leather),
                0 0 0 8px rgba(215,165,74,.6), 0 30px 60px -20px rgba(0,0,0,.8); }
  .quill-icon { flex: none; color: var(--ink-soft); }
  textarea {
    flex: 1; border: 0; background: transparent; resize: none; color: var(--ink);
    font: italic 400 1.3rem/1.45 var(--fell); padding: 12px 4px; min-height: 54px; max-height: 190px;
  }
  textarea::placeholder { color: #8B7457; }
  textarea:focus { outline: none; }
  button { cursor: pointer; border: 0; }
  .ask {
    flex: none; align-self: stretch; padding: 0 26px; border-radius: 4px;
    font: 400 1.15rem var(--fell-sc); letter-spacing: .04em;
    color: var(--parchment); background: var(--wax);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.25);
    transition: filter .15s;
  }
  .ask:hover { filter: brightness(1.12); }
  .ask:disabled { filter: saturate(.4) brightness(.85); cursor: progress; }
  button:focus-visible, .chip:focus-visible, .mark:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .under {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 14px; margin-top: 22px;
  }
  .mode { display: inline-flex; border: 1px solid rgba(215,165,74,.35); border-radius: 999px; padding: 3px; }
  .mode label { position: relative; }
  .mode input { position: absolute; opacity: 0; }
  .mode span {
    display: block; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    font: 400 .95rem var(--fell-sc); color: rgba(234,217,181,.7); transition: background .2s, color .2s;
  }
  .mode input:checked + span { background: var(--gold); color: var(--ink); }
  .mode input:focus-visible + span { outline: 2px solid var(--parchment); }
  .hint { font: italic .9rem var(--fell); color: rgba(234,217,181,.5); }

  .examples { margin-top: 30px; text-align: center; }
  .examples p { font: italic .95rem var(--fell); color: rgba(234,217,181,.55); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    background: transparent; color: rgba(234,217,181,.85);
    border: 1px solid rgba(215,165,74,.3); border-radius: 3px; padding: 6px 12px;
    font: italic 400 1rem var(--fell); transition: border-color .2s, color .2s, background .2s;
  }
  .chip:hover { border-color: var(--gold); color: var(--parchment); background: rgba(215,165,74,.08); }

  /* ---------- pages (answers) ---------- */
  #pages { margin-top: 56px; display: grid; gap: 40px; }
  .page {
    position: relative; color: var(--ink); padding: 44px 48px 30px;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(120,80,30,.18), transparent 45%),
      radial-gradient(ellipse at 100% 100%, rgba(120,80,30,.22), transparent 45%),
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.35), transparent 70%),
      var(--parchment);
    border-radius: 3px;
    box-shadow: inset 0 0 60px rgba(110,70,25,.35), 0 0 0 1px rgba(90,60,30,.4),
                12px 0 0 -6px var(--parchment-deep), 12px 0 0 -5px rgba(90,60,30,.35),
                0 34px 60px -24px rgba(0,0,0,.9);
    animation: unfold .6s cubic-bezier(.2,.7,.2,1);
    transform-origin: top center;
  }
  @keyframes unfold { from { opacity: 0; transform: perspective(900px) rotateX(-8deg) translateY(10px); } }
  .page::after {                  /* gilt top edge */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7;
  }
  .asked { font: italic 400 1.15rem/1.4 var(--fell); color: var(--ink-soft); margin: 0 0 18px; }
  .asked::before { content: "Asked of the book: "; font-style: normal; font-family: var(--fell-sc); }
  .answer { font: 400 1.32rem/1.75 var(--garamond); margin: 0; }
  .answer::first-letter {         /* illuminated drop cap */
    float: left; font: 400 3.9rem/.82 var(--fell); color: var(--wax);
    padding: 8px 10px 0 0; text-shadow: 1px 1px 0 rgba(215,165,74,.6);
  }
  .mark {
    font: 400 .78rem var(--fell-sc); color: var(--parchment); background: var(--wax);
    border-radius: 50%; width: 1.55em; height: 1.55em; display: inline-grid; place-items: center;
    vertical-align: .45em; margin: 0 2px; box-shadow: 0 0 0 2px rgba(122,31,43,.25);
  }
  .mark:hover { filter: brightness(1.2); }

  .sources { margin-top: 30px; padding-top: 20px; position: relative; display: grid; gap: 16px; }
  .sources::before {
    content: "❦"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    color: var(--wax); font-size: 1.1rem; background: transparent;
  }
  .sources::after {
    content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(91,69,50,.5), transparent);
  }
  .src { display: grid; grid-template-columns: 74px 1fr; gap: 16px; align-items: start;
         padding: 10px; margin: -10px; border-radius: 4px; transition: background .4s; }
  .src.glow { background: rgba(215,165,74,.28); }
  .seal {                          /* wax seal bearing the page number */
    width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #A43545, var(--wax) 55%, #4E121B);
    color: #F3DCC0; text-align: center; line-height: 1;
    box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 0 0 4px rgba(0,0,0,.12), inset 0 0 0 6px rgba(255,255,255,.06);
    clip-path: polygon(50% 0, 60% 4%, 71% 3%, 79% 10%, 89% 13%, 92% 24%, 99% 33%, 97% 44%, 100% 54%,
      95% 64%, 95% 75%, 87% 82%, 81% 92%, 70% 94%, 60% 100%, 50% 97%, 40% 100%, 30% 94%, 19% 92%,
      13% 82%, 5% 75%, 5% 64%, 0 54%, 3% 44%, 1% 33%, 8% 24%, 11% 13%, 21% 10%, 29% 3%, 40% 4%);
  }
  .seal small { display: block; font: italic .62rem var(--fell); opacity: .8; }
  .seal b { font: 400 1.45rem var(--fell); }
  .src-label { font: 400 .9rem var(--fell-sc); color: var(--ink-soft); margin: 2px 0 4px; }
  .quote { margin: 0; font: italic 400 1.05rem/1.55 var(--garamond); color: var(--ink); }
  .quote::before { content: "“"; } .quote::after { content: "”"; }

  .colophon {
    margin-top: 24px; text-align: center; font: italic .9rem var(--fell); color: var(--ink-soft);
  }

  /* refusal: the pages stay blank */
  .page.blank { text-align: center; }
  .page.blank .closed { margin: 6px auto 14px; color: var(--ink-soft); }
  .page.blank h2 { font: 400 1.7rem var(--fell); margin: 0 0 6px; }
  .page.blank p.why { margin: 0 auto; max-width: 30em; color: var(--ink-soft); font-size: 1.05rem; }

  .page.torn { background: #E6CFC0; }
  .page.torn h2 { font: 400 1.4rem var(--fell); margin: 0 0 6px; color: var(--wax); }
  .page.torn p { margin: 0; }

  /* ---------- quill loader ---------- */
  .writing { display: flex; align-items: center; gap: 22px; }
  .quill-wrap { position: relative; width: 120px; height: 60px; flex: none; }
  .ink-line {
    position: absolute; left: 0; bottom: 10px; height: 2px; width: 100%;
    background: repeating-linear-gradient(90deg, var(--ink) 0 9px, transparent 9px 13px);
    transform-origin: left; animation: ink 2.4s ease-in-out infinite; opacity: .75;
  }
  @keyframes ink { 0% { transform: scaleX(0); } 70%,100% { transform: scaleX(1); } }
  .quill {
    position: absolute; bottom: 8px; left: 0; color: var(--ink);
    animation: write 2.4s ease-in-out infinite;
  }
  @keyframes write {
    0% { transform: translate(-6px, 0) rotate(0); }
    10% { transform: translate(6px, -4px) rotate(-6deg); }
    20% { transform: translate(18px, 0) rotate(3deg); }
    30% { transform: translate(30px, -5px) rotate(-5deg); }
    40% { transform: translate(44px, 0) rotate(4deg); }
    50% { transform: translate(58px, -4px) rotate(-4deg); }
    60% { transform: translate(72px, 0) rotate(3deg); }
    70% { transform: translate(98px, -3px) rotate(-3deg); }
    100% { transform: translate(-6px, 0) rotate(0); }
  }
  .writing h2 { font: 400 1.5rem var(--fell); margin: 0; }
  .writing p { margin: 2px 0 0; font: italic 1rem var(--fell); color: var(--ink-soft); }

  footer { margin-top: 70px; text-align: center; font: italic .9rem var(--fell); color: rgba(234,217,181,.4); }

  @media (max-width: 600px) {
    main { padding-top: 44px; }
    .desk { flex-wrap: wrap; padding: 10px; }
    .quill-icon { display: none; }
    textarea { width: 100%; flex-basis: 100%; }
    .ask { width: 100%; padding: 12px; }
    .page { padding: 34px 22px 24px; }
    .src { grid-template-columns: 58px 1fr; }
    .seal { width: 54px; height: 54px; }
    .seal b { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .motes { display: none; }
  }
</style>
</head>
<body>
<div class="motes" aria-hidden="true" id="motes"></div>
<main>
  <header>
    <div class="candle" aria-hidden="true"></div>
    <h1>The Answering Book</h1>
    <div class="rule" aria-hidden="true">✦</div>
    <p class="lede">Write your question upon the page. The book answers only from its own pages and marks each one with a seal, and where its pages are silent, it will not invent.</p>
  </header>

  <form id="ask-form">
    <div class="desk">
      <svg class="quill-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 3C12 4 7 9 5 17l-1 4 4-1c8-2 13-7 12-17Z"/><path d="M4 21 13 12"/><path d="M9 16h4"/>
      </svg>
      <textarea id="q" rows="1" maxlength="1000" placeholder="What would you ask the book?" aria-label="Your question" required></textarea>
      <button class="ask" id="ask-btn" type="submit">Ask</button>
    </div>
    <div class="under">
      <div class="mode" role="radiogroup" aria-label="How the book searches">
        <label><input type="radio" name="mode" value="full" checked><span>Full pipeline</span></label>
        <label><input type="radio" name="mode" value="bm25_baseline"><span>BM25 baseline</span></label>
      </div>
      <span class="hint">Enter to ask · Shift + Enter for a new line</span>
    </div>
  </form>

  <div class="examples">
    <p>Or begin with one of these</p>
    <div class="chips" id="chips"></div>
  </div>

  <section id="pages" aria-live="polite"></section>

  <footer>RAG with Citations · THWS NLP Portfolio 1</footer>
</main>

<script>
const EXAMPLES = [
  "Who is Nicolas Flamel?",
  "What does the Mirror of Erised show?",
  "What is Harry's wand made of?",
  "What is Polyjuice Potion?",
  "What is the capital of France?",
];

const form = document.getElementById("ask-form");
const input = document.getElementById("q");
const btn = document.getElementById("ask-btn");
const pages = document.getElementById("pages");

// dust motes in the candlelight
const motes = document.getElementById("motes");
for (let i = 0; i < 22; i++) {
  const m = document.createElement("i");
  m.style.left = Math.random() * 100 + "%";
  m.style.animationDuration = 14 + Math.random() * 16 + "s";
  m.style.animationDelay = -Math.random() * 30 + "s";
  m.style.transform = `scale(${0.5 + Math.random()})`;
  motes.append(m);
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) node.append(c instanceof Node ? c : document.createTextNode(c));
  return node;
}
function svg(markup) {
  return new DOMParser().parseFromString(markup, "image/svg+xml").documentElement;
}

const chips = document.getElementById("chips");
EXAMPLES.forEach(text => chips.append(
  el("button", { type: "button", class: "chip", onclick: () => { input.value = text; autosize(); ask(); } }, text)
));

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 190) + "px";
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
form.addEventListener("submit", e => { e.preventDefault(); ask(); });

const modeName = m => m === "bm25_baseline" ? "BM25 baseline" : "full pipeline";
const secs = ms => (ms / 1000).toFixed(1) + " s";

// [1], [2] in the answer become small wax marks that point to their seal below
function renderAnswer(text, pid) {
  const p = el("p", { class: "answer" });
  for (const part of text.split(/(\[\d+\])/g)) {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) {
      p.append(el("button", {
        type: "button", class: "mark", "aria-label": `Show source ${m[1]}`,
        onclick: () => {
          const s = document.getElementById(`${pid}-s${m[1]}`);
          if (!s) return;
          s.scrollIntoView({ behavior: "smooth", block: "nearest" });
          s.classList.add("glow");
          setTimeout(() => s.classList.remove("glow"), 1400);
        },
      }, m[1]));
    } else if (part) {
      p.append(part);
    }
  }
  return p;
}

function answeredPage(q, data, pid) {
  const sources = data.citations.map(c => {
    const n = c.id.replace(/\D/g, "");
    return el("div", { class: "src", id: `${pid}-s${n}` },
      el("div", { class: "seal", "aria-label": `Page ${c.page ?? "unknown"}` },
        el("span", {}, el("small", {}, "page"), el("b", {}, String(c.page ?? "–")))),
      el("div", {},
        el("p", { class: "src-label" }, `Source ${n} · ${c.document}`),
        el("p", { class: "quote" }, c.snippet)));
  });
  return el("article", { class: "page", id: pid },
    el("p", { class: "asked" }, q),
    renderAnswer(data.answer, pid),
    sources.length ? el("div", { class: "sources" }, sources) : "",
    el("p", { class: "colophon" },
      `Answered from ${data.citations.length} ${data.citations.length === 1 ? "page" : "pages"} · ${modeName(data.mode)} · ${secs(data.latency_ms)}`));
}

function blankPage(q, data, pid) {
  return el("article", { class: "page blank", id: pid },
    el("p", { class: "asked" }, q),
    el("div", { class: "closed" }, svg(
      `<svg xmlns="http://www.w3.org/2000/svg" width="54" height="44" viewBox="0 0 54 44" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
         <path d="M27 8C20 3 10 3 3 5v32c7-2 17-2 24 3 7-5 17-5 24-3V5c-7-2-17-2-24 3Z"/>
         <path d="M27 8v32"/>
         <path d="M9 14h12M9 20h9M33 14h12M36 20h9" stroke-dasharray="1 4" stroke-linecap="round"/>
       </svg>`)),
    el("h2", {}, "These pages hold no answer"),
    el("p", { class: "why" }, "The book searched its pages and found nothing that answers this, so it leaves the page blank instead of guessing."),
    el("p", { class: "colophon" }, `Refused · ${modeName(data.mode)} · ${secs(data.latency_ms)}`));
}

function tornPage(q, title, detail) {
  return el("article", { class: "page torn" },
    el("p", { class: "asked" }, q),
    el("h2", {}, title),
    el("p", {}, detail));
}

async function ask() {
  const q = input.value.trim();
  if (!q || btn.disabled) return;
  const mode = form.querySelector("input[name=mode]:checked").value;
  const pid = "p" + Date.now();

  const status = el("p", {}, "Turning the pages · 0 s");
  const loading = el("article", { class: "page", id: pid },
    el("p", { class: "asked" }, q),
    el("div", { class: "writing", role: "status" },
      el("div", { class: "quill-wrap", "aria-hidden": "true" },
        el("div", { class: "ink-line" }),
        el("div", { class: "quill" }, svg(
          `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
             <path d="M20 3C12 4 7 9 5 17l-1 4 4-1c8-2 13-7 12-17Z"/><path d="M4 21 13 12"/></svg>`))),
      el("div", {}, el("h2", {}, "The book is writing"), status)));
  pages.prepend(loading);
  btn.disabled = true; btn.textContent = "Writing…";

  const t0 = performance.now();
  const tick = setInterval(() => {
    const s = Math.round((performance.now() - t0) / 1000);
    status.textContent = (s < 3 ? "Turning the pages" : "The ink is still wet") + ` · ${s} s`;
  }, 500);

  let page;
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, mode }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = typeof data.detail === "string" ? data.detail
        : res.status === 422 ? "The question is empty or longer than 1000 characters."
        : `The server answered with status ${res.status}.`;
      page = tornPage(q, res.status === 503 ? "The book is not ready yet" : "The ink ran dry", detail);
    } else {
      page = data.status === "refused" ? blankPage(q, data, pid) : answeredPage(q, data, pid);
    }
  } catch {
    page = tornPage(q, "The book cannot be reached",
      "Start the API with: python -m uvicorn src.api.main:app --reload, then ask again.");
  } finally {
    clearInterval(tick);
    btn.disabled = false; btn.textContent = "Ask";
  }
  loading.replaceWith(page);
  input.value = ""; autosize(); input.focus();
}
</script>
</body>
</html>
